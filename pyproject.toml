[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm"
version = "0.1.0"
description = "Predictive maintenance: RUL estimation + maintenance-decision support on NASA C-MAPSS"
requires-python = ">=3.10"
dependencies = []  # runtime deps tracked in requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
